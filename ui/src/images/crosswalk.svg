<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    A zebra crossing seen from above: five stripes running across the road, with the road's two
    edges implied by the gap either side. Filled explicitly white rather than with currentColor,
    because the icon is loaded through an <img> tag and currentColor resolves against the SVG's own
    context there — it falls back to black, which is what made the first version render as dark
    bars on the toolbar.
  -->
  <g fill="#ffffff">
    <rect x="4" y="5"    width="24" height="3.6" rx="1.4"/>
    <rect x="4" y="10.4" width="24" height="3.6" rx="1.4"/>
    <rect x="4" y="15.8" width="24" height="3.6" rx="1.4"/>
    <rect x="4" y="21.2" width="24" height="3.6" rx="1.4"/>
  </g>
</svg>
